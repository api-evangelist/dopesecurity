aid: dopesecurity
name: dope.security
description: 'dope.security is a cybersecurity company that builds the first fly-direct Secure Web
  Gateway (dope.swg) — a next-generation SWG that runs security directly on the endpoint (on-device
  proxy, local SSL inspection, URL and category filtering, cloud application control) instead of
  routing traffic through a data-center stopover, alongside AI-powered Data Loss Prevention and a
  neural CASB (casb.neural) for shadow IT/AI discovery and data posture. Its Flightdeck partner API
  lets administrators manage policies, custom URL categories, URL/application bypass lists, SSL
  inspection, and endpoint status programmatically, and it ships an official open-source MCP server.
  Founded in 2021, based in Mountain View and Cork, and backed by GV.'
