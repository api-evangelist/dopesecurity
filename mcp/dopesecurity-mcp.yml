source: https://github.com/dopesecurity/mcp
server:
  name: dope-security
  description: Official open-source local MCP server for dope.security. Lets an AI assistant talk to your
    dope.security tenant — inspect endpoints, read and modify web policies, and curate custom URL categories.
    Wraps most of the Flightdeck partner API. Read-only out of the box; writes and destructive operations
    are opt-in via environment variables. Beta.
  transport: stdio
  package: dopesecurity-mcp-server
  registry: pypi
  install: uvx dopesecurity-mcp-server
  repository: https://github.com/dopesecurity/mcp
  license: MIT
  api: openapi/dopesecurity-flightdeck-openapi.yml
config:
  env:
  - name: DOPE_CLIENT_ID
    required: true
    description: API client ID issued from the dope console.
  - name: DOPE_CLIENT_SECRET
    required: true
    description: API client secret issued from the dope console.
  - name: DOPE_ENABLE_MUTATIONS
    default: 'false'
    description: Expose write tools that modify tenant state.
  - name: DOPE_ENABLE_DESTRUCTIVE
    default: 'false'
    description: Additionally expose destructive tools (whole-policy drops, section resets). Requires
      mutations.
  - name: DOPE_TIMEOUT_SECONDS
    default: '30'
  - name: DOPE_LOG_LEVEL
    default: INFO
access_tiers:
- tier: read-only
  mutations: false
  destructive: false
  description: Inspect endpoints, policies, custom categories. Cannot modify the tenant.
- tier: read-write
  mutations: true
  destructive: false
  description: Per-entry creates, updates, upserts, assigns/unassigns, and per-entry deletes.
- tier: read-write-destructive
  mutations: true
  destructive: true
  description: Adds whole-policy drops, whole-section resets to base, whole-category deletes, wipe-all-URLs.
notes: Flightdeck RBAC still applies on top of whichever tier is enabled; a registered tool may still
  be rejected if the OAuth client role does not permit it. Tools not enabled by the active combination
  are not registered at all.
